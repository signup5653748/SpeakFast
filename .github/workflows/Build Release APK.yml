name: Build & Release Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit the version bump and create releases

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required to push commits back to the repo
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Auto-Increment Version
      id: bump_version
      run: |
        # 1. Extract current versionCode and increment it
        CURRENT_VC=$(grep 'versionCode =' app/build.gradle.kts | grep -o '[0-9]\+' | head -1)
        NEW_VC=$((CURRENT_VC + 1))
        sed -i "s/versionCode = $CURRENT_VC/versionCode = $NEW_VC/" app/build.gradle.kts

        # 2. Extract current versionName and increment the last number (e.g., 1.0 -> 1.1)
        CURRENT_VN=$(grep 'versionName =' app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')
        NEW_VN=$(echo "$CURRENT_VN" | awk -F. -v OFS=. '{$NF = $NF + 1;} 1')
        sed -i "s/versionName = \".*\"/versionName = \"$NEW_VN\"/" app/build.gradle.kts

        # 3. Export for later steps
        echo "NEW_VERSION_CODE=$NEW_VC" >> $GITHUB_ENV
        echo "NEW_VERSION_NAME=$NEW_VN" >> $GITHUB_ENV
        echo "NEW_TAG=v$NEW_VN" >> $GITHUB_ENV

        echo "✅ Bumped version to $NEW_VN (Code: $NEW_VC)"

    - name: Commit Version Bump
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add app/build.gradle.kts
        git commit -m "chore: bump version to ${{ env.NEW_VERSION_NAME }} (${{ env.NEW_VERSION_CODE }})"
        git push origin main

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::KEYSTORE_BASE64 secret is not set."
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
        echo "KEYSTORE_PATH=$(pwd)/app/release.keystore" >> $GITHUB_ENV

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew :app:assembleRelease --no-daemon --build-cache

    - name: Wipe Keystore from Runner
      if: always()
      run: rm -f app/release.keystore

    - name: Locate APK
      id: find_apk
      run: |
        FOUND=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
        if [ -z "$FOUND" ]; then
          echo "::error::No signed release APK found."
          exit 1
        fi
        echo "apk_path=$FOUND" >> "$GITHUB_OUTPUT"

    - name: Get Commit Info
      id: commit_info
      run: |
        COMMIT_MSG=$(git log -1 --pretty=format:"%s")
        COMMIT_HASH=$(git rev-parse --short HEAD)
        COMMIT_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
        echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT
        echo "hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
        echo "date=$COMMIT_DATE" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.NEW_TAG }}
        name: "SpeakFast v${{ env.NEW_VERSION_NAME }} (Build ${{ github.run_id }})"
        body: |
          🚀 **Signed Release APK**
          
          📦 **Version:** ${{ env.NEW_VERSION_NAME }} (Code: ${{ env.NEW_VERSION_CODE }})
          📝 **Commit Message:** ${{ steps.commit_info.outputs.message }}
          🔗 **Commit Hash:** `${{ steps.commit_info.outputs.hash }}`
          📅 **Build Date:** ${{ steps.commit_info.outputs.date }}
          🌿 **Branch:** `${{ github.ref_name }}`
          
          **Download the `.apk` file below and install it on your Android device.**
        files: ${{ steps.find_apk.outputs.apk_path }}
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpeakFast-Release-v${{ env.NEW_VERSION_NAME }}
        path: ${{ steps.find_apk.outputs.apk_path }}
        retention-days: 30