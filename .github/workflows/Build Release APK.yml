name: Build & Release Signed APK

on:
  workflow_dispatch: # ✅ STRICTLY MANUAL ONLY. No 'push' triggers.

jobs:
  build-and-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Get Latest Release Tag
      id: get_latest_tag
      run: |
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
        echo "📍 Latest release: $LATEST_TAG"

    - name: Generate Changelog
      id: changelog
      run: |
        LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"
        
        # Get all commits since last tag
        if [ "$LATEST_TAG" = "v0.0.0" ]; then
          COMMITS=$(git log --pretty=format:"%s|%h" --reverse)
        else
          COMMITS=$(git log ${LATEST_TAG}..HEAD --pretty=format:"%s|%h" --reverse)
        fi
        
        # Categorize commits
        FEATURES=""
        BUGFIXES=""
        UI_CHANGES=""
        INTERNAL=""
        
        while IFS='|' read -r msg hash; do
          if [[ -z "$msg" ]]; then continue; fi
          
          case "$msg" in
            feat:*|Feat:*|feature:*|Feature:*)
              FEATURES="${FEATURES}\n- ✨ ${msg#*:} [\`${hash}\`](https://github.com/${{ github.repository }}/commit/${hash})"
              ;;
            fix:*|Fix:*|bugfix:*|Bugfix:*)
              BUGFIXES="${BUGFIXES}\n- 🐛 ${msg#*:} [\`${hash}\`](https://github.com/${{ github.repository }}/commit/${hash})"
              ;;
            ui:*|UI:*|style:*|Style:*|design:*|Design:*)
              UI_CHANGES="${UI_CHANGES}\n- 🎨 ${msg#*:} [\`${hash}\`](https://github.com/${{ github.repository }}/commit/${hash})"
              ;;
            *)
              INTERNAL="${INTERNAL}\n- ⚙️ ${msg} [\`${hash}\`](https://github.com/${{ github.repository }}/commit/${hash})"
              ;;
          esac
        done <<< "$COMMITS"
        
        # Build changelog
        CHANGELOG=""
        
        if [ -n "$FEATURES" ]; then
          CHANGELOG="${CHANGELOG}## ✨ New Features${FEATURES}\n\n"
        fi
        
        if [ -n "$BUGFIXES" ]; then
          CHANGELOG="${CHANGELOG}## 🐛 Bug Fixes${BUGFIXES}\n\n"
        fi
        
        if [ -n "$UI_CHANGES" ]; then
          CHANGELOG="${CHANGELOG}## 🎨 UI Changes${UI_CHANGES}\n\n"
        fi
        
        if [ -n "$INTERNAL" ]; then
          CHANGELOG="${CHANGELOG}## ⚙️ Internal${INTERNAL}\n\n"
        fi
        
        if [ -z "$CHANGELOG" ]; then
          CHANGELOG="## 🎨 UI Changes\n- 🔄 General improvements and stability updates"
        fi
        
        # Escape for GitHub Actions
        CHANGELOG="${CHANGELOG//'%'/'%25'}"
        CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
        CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
        
        echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT
        echo "✅ Generated changelog with $(echo -e "$FEATURES$BUGFIXES$UI_CHANGES$INTERNAL" | grep -c "^-") commits"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::KEYSTORE_BASE64 secret is not set."
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
        echo "KEYSTORE_PATH=$(pwd)/app/release.keystore" >> $GITHUB_ENV

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew :app:assembleRelease --no-daemon --build-cache

    - name: Wipe Keystore from Runner
      if: always()
      run: rm -f app/release.keystore

    - name: Locate APK
      id: find_apk
      run: |
        FOUND=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
        if [ -z "$FOUND" ]; then
          echo "::error::No signed release APK found."
          exit 1
        fi
        echo "apk_path=$FOUND" >> "$GITHUB_OUTPUT"

    - name: Auto-Increment Version (Only on Success)
      id: bump_version
      run: |
        CURRENT_VC=$(grep 'versionCode =' app/build.gradle.kts | grep -o '[0-9]\+' | head -1)
        NEW_VC=$((CURRENT_VC + 1))
        sed -i "s/versionCode = $CURRENT_VC/versionCode = $NEW_VC/" app/build.gradle.kts

        CURRENT_VN=$(grep 'versionName =' app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')
        NEW_VN=$(echo "$CURRENT_VN" | awk -F. -v OFS=. '{$NF = $NF + 1;} 1')
        sed -i "s/versionName = \".*\"/versionName = \"$NEW_VN\"/" app/build.gradle.kts

        echo "NEW_VERSION_CODE=$NEW_VC" >> $GITHUB_ENV
        echo "NEW_VERSION_NAME=$NEW_VN" >> $GITHUB_ENV
        echo "NEW_TAG=v$NEW_VN" >> $GITHUB_ENV
        echo "✅ Bumped version to $NEW_VN (Code: $NEW_VC)"

    - name: Commit Version Bump
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add app/build.gradle.kts
        git commit -m "chore: bump version to ${{ env.NEW_VERSION_NAME }} (${{ env.NEW_VERSION_CODE }})"
        git push origin main

    - name: Get Commit Info
      id: commit_info
      run: |
        COMMIT_MSG=$(git log -1 --pretty=format:"%s")
        COMMIT_HASH=$(git rev-parse --short HEAD)
        COMMIT_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
        echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT
        echo "hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
        echo "date=$COMMIT_DATE" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.NEW_TAG }}
        name: "SpeakFast v${{ env.NEW_VERSION_NAME }} (Build ${{ github.run_id }})"
        body: |
          🚀 **Signed Release APK**
          
          📦 **Version:** ${{ env.NEW_VERSION_NAME }} (Code: ${{ env.NEW_VERSION_CODE }})
          📅 **Build Date:** ${{ steps.commit_info.outputs.date }}
          
          ---
          
          ## 📝 What's New
          
          ${{ steps.changelog.outputs.changelog }}
          
          ---
          
          📦 **Downloads:**
          - 📱 [app-release.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.NEW_TAG }}/${{ steps.find_apk.outputs.apk_path | split('/') | last }}) — Signed APK (install directly)
          
          🔗 **Full Changelog:** [Compare](https://github.com/${{ github.repository }}/compare/${{ steps.get_latest_tag.outputs.latest_tag }}...${{ env.NEW_TAG }})
        files: ${{ steps.find_apk.outputs.apk_path }}
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SpeakFast-Release-v${{ env.NEW_VERSION_NAME }}
        path: ${{ steps.find_apk.outputs.apk_path }}
        retention-days: 30