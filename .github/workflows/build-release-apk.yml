name: Build Signed Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "KEYSTORE_PATH=app/release.keystore" >> $GITHUB_ENV
          ls -la app/release.keystore

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate Release APK
        run: |
          mkdir -p build-artifacts
          FOUND=$(find . -path "*/build/outputs/apk/release/*.apk" -not -path "*/build-artifacts/*" | head -1)
          if [ -z "$FOUND" ]; then
            echo "No release APK found. Check the build log above."
            exit 1
          fi
          REPO_NAME="${{ github.event.repository.name }}"
          cp "$FOUND" "./build-artifacts/${REPO_NAME}-release.apk"
          echo "APK copied to build-artifacts/${REPO_NAME}-release.apk"

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeakFast-Release-APK
          path: build-artifacts/*.apk
          retention-days: 30